# Puerto del servidor (en Render toma automáticamente la variable PORT o usa 3001 por defecto)
server.port=${PORT:3001}

# Configuracion de conexion a Base de Datos (en la nube se sobreescribe con variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=biblioteca_db;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}

# Configuracion de Hibernate / JPA
# update: actualiza o crea las tablas automaticamente si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
