# Puerto del servidor (3001 para coincidir con la configuracion actual de tu frontend React)
server.port=3001

# Configuracion de conexion a SQL Server 2022
# Servidor: localhost:1433, Base de datos: biblioteca_db
# Usuario: sa, Contrasena: 123
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=biblioteca_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuracion de Hibernate / JPA
# update: actualiza o crea las tablas automaticamente si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
